# STools — весь стек.
#
# Требование «не зависеть ни от чего» трактуется буквально: после сборки
# образов стек поднимается и работает без доступа в интернет. Проверяется
# отключением сети у контейнеров, а не на слово.
#
# Запуск из корня репозитория:
#   docker compose -f ops/docker-compose.yml up --build

name: stools

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kbaudit}
      POSTGRES_USER: ${POSTGRES_USER:-kbaudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # API не должен стартовать раньше базы: миграции применяются
      # на старте, и падение здесь выглядит как поломка приложения.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kbaudit} -d ${POSTGRES_DB:-kbaudit}"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped

  api:
    build:
      context: ../backend
    environment:
      STOOLS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kbaudit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kbaudit}
      STOOLS_SESSION_SECRET: ${STOOLS_SESSION_SECRET:?задайте STOOLS_SESSION_SECRET в .env}
      STOOLS_DATA_DIR: /data
      # Инструмент хранит инвентарь внутренней инфраструктуры — модель
      # доступа не слабее, чем к анализируемым системам, поэтому по
      # умолчанию Secure включён. Для лаборатории без TLS (Caddy без
      # STOOLS_SITE_ADDRESS слушает голый HTTP) переключите явно в false —
      # иначе Safari молча выбросит cookie, и вход не сработает.
      STOOLS_SESSION_COOKIE_SECURE: ${STOOLS_SESSION_COOKIE_SECURE:-true}
    volumes:
      # Архивы выгрузок и кэш разбора переживают пересоздание контейнера:
      # без архива нельзя перепрогнать старый снапшот доработанным
      # парсером, без кэша — пересчитать его при смене профиля.
      - archives:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/auth/oidc/status', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Потолки распаковки (512 МБ: выгрузки AD/KSC, член zip —
    # kbaudit/safe_io.py) ограничивают, но не гарантируют память: разбор JSON
    # занимает кратно больше самих байтов. При превышении контейнер
    # перезапускается (restart: unless-stopped).
    mem_limit: 2g
    cpus: 2
    # Наружу не публикуется: единственный вход — через прокси.
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      # Пусто/не задано — Caddy слушает голый :80 (ops/Caddyfile). Имя
      # хоста ("stools.example.ru") — Caddy сам заводит сертификат и
      # слушает 443 с автоматическим HTTPS; тогда порт 443 нужно
      # опубликовать дополнительно (свой compose.override.yml или правка
      # `ports` ниже) — по умолчанию стек публикует только 80/STOOLS_PORT.
      # Пустое значение заменяется на ":80" здесь: заданную, но пустую
      # переменную Caddy подставляет как есть, и конфиг не разбирается.
      STOOLS_SITE_ADDRESS: ${STOOLS_SITE_ADDRESS:-:80}
      # Откуда сертификат: auto | internal | files (ops/Caddyfile, README «TLS»).
      STOOLS_TLS: ${STOOLS_TLS:-auto}
    volumes:
      # Свои сертификат и ключ для STOOLS_TLS=files: ops/tls/cert.pem и
      # ops/tls/key.pem (каталог в .gitignore).
      - ./tls:/etc/caddy/tls:ro
      # Данные Caddy: полученные сертификаты и корневой сертификат своего
      # центра (STOOLS_TLS=internal) переживают пересоздание контейнера —
      # иначе розданный на рабочие места корень перестал бы подходить.
      - caddy-data:/data
    ports:
      - "${STOOLS_PORT:-8080}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

volumes:
  db-data:
  archives:
  caddy-data:
