# Настройки анализа SonarQube для STools.
#
# Ключ проекта здесь не задаётся: его выдаёт SonarQube при заведении
# проекта, и он передаётся при запуске сканера:
#   sonar-scanner -Dsonar.projectKey=<ключ> -Dsonar.host.url=<адрес> -Dsonar.token=<токен>
sonar.projectName=STools
sonar.sourceEncoding=UTF-8

# Что идёт в прод: код API, ядро анализа, интерфейс и Dockerfile образов.
# Список задан явно, чтобы сканер не обходил .venv, node_modules и dist:
# в них символические ссылки, на Windows сканер на них падает.
sonar.sources=backend/api,backend/kbaudit,frontend/src,backend/Dockerfile,frontend/Dockerfile

# Автотесты pytest. Объявлены тестами, чтобы к ним не применялись правила
# основного кода (тестовые пароли фикстур и т.п.).
sonar.tests=backend/tests

# Моки интерфейса работают только в dev-режиме (import.meta.env.DEV)
# и в прод-сборку не попадают.
sonar.exclusions=frontend/src/**/mocks/**

# Миграции Alembic пишутся по шаблону и повторяют друг друга по форме —
# в дублирование их не считаем, но проверяем как код.
sonar.cpd.exclusions=backend/api/db/migrations/**

sonar.python.version=3.13
