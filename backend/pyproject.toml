[project]
name = "kbaudit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "httpx>=0.27"]
# Слой HTTP и хранения (backend/api/) — вне ядра, см. tests/test_boundaries.py.
# psycopg (v3) выбран вместо asyncpg: весь сервис синхронный по конструкции —
# фоновая обработка задания идёт в потоке BackgroundTasks, а не в asyncio-
# задаче, и смешивать асинхронную сессию SQLAlchemy с синхронными вызовами
# ядра (kbaudit.report.build_report и т.п.) незачем. psycopg3 умеет и sync,
# и async в одном драйвере, если понадобится async в будущем.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    # Модуль VM: клиент MaxPatrol и скачивание справочников; потоковый JSON.
    "httpx>=0.27",
    "ijson>=3.2",
    # Модуль AD: онлайн-сборщик по LDAP и SYSVOL по SMB.
    "ldap3>=2.9",
    "smbprotocol>=1.13",
    # NTLM (учётка ДОМЕН\имя) считает хеш пароля через MD4, а в OpenSSL 3 он
    # выключен; ldap3 тогда берёт MD4 отсюда (tests/ad/test_ntlm_support.py).
    "pycryptodome>=3.20",
    # Вход по OIDC: проверка подписи id_token по JWKS.
    "PyJWT[crypto]>=2.9",
    # Шифрование секретов подключений в базе (api/crypto.py).
    "cryptography>=42",
    # База часовых поясов для STOOLS_TZ: в slim-образе системной zoneinfo может не быть.
    "tzdata>=2024.1",
    # Модуль Assets: прямые и обратные запросы к DNS-серверу.
    "dnspython>=2.6",
]

[project.scripts]
kbaudit = "kbaudit.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kbaudit*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"api/db/migrations/versions/*.py" = ["E501"]
# FastAPI требует вызывать Depends()/Query() прямо в значении по умолчанию —
# это идиома фреймворка, а не забытый вызов функции (правило B008 общего
# назначения его не различает).
"api/routers/*.py" = ["B008"]
"api/modules/*/routers/*.py" = ["B008"]
"api/platform/routers/*.py" = ["B008"]
"api/platform/findings/router.py" = ["B008"]
"api/deps.py" = ["B008"]
"api/jobs.py" = ["B008"]
"api/rbac.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["alembic.*", "ijson.*", "ldap3.*", "smbclient.*"]
ignore_missing_imports = true
